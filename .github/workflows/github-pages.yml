name: Đăng lên GitHub Pages
# Bản xem thử tại https://trongnghiabui95.github.io/kienthuclamme/ – tự cập nhật mỗi khi main thay đổi và mỗi sáng.
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          BASE_PATH: /kienthuclamme
          SITE_URL: https://trongnghiabui95.github.io/kienthuclamme
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
