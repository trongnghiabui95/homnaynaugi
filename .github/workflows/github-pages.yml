name: Đăng lên GitHub Pages
# Bản xem thử tại https://<tài-khoản>.github.io/<tên-repo>/ – tự cập nhật khi main thay đổi và mỗi sáng. Đổi tên repo không cần sửa file này.
on:
  push:
    branches: [main]
  schedule:
    # Giờ VN: 4:53, 5:43 (dự phòng, #91), 6:20 (mốc chính)
    - cron: "53 21 * * *"
    - cron: "43 22 * * *"
    - cron: "20 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          BASE_PATH: /${{ github.event.repository.name }}
          # Bản xem thử: noindex toàn bộ, robots.txt chặn hết, canonical/hreflang trỏ về bản chính (Issue #68)
          PREVIEW: "1"
          CANONICAL_URL: https://homnaynaugi.pages.dev
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
