name: Cập nhật nội dung từ Google Sheets
# Chạy mỗi sáng giờ Việt Nam: 4:47 và 5:37 (dự phòng, phút lẻ vì GitHub hay hoãn lịch ở mốc đông, #91), 6:10 (mốc chính)
# và khi bấm tay ở tab Actions. Chạy lại trong ngày chỉ dựng lại web, không tạo commit hay Issue.
on:
  schedule:
    - cron: "47 21 * * *"
    - cron: "37 22 * * *"
    - cron: "10 23 * * *"
  workflow_dispatch:
concurrency:
  group: cap-nhat-noi-dung
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Kiểm tra dữ liệu Sheet
        env: { SHEET_ID: "${{ secrets.SHEET_ID }}" }
        run: |
          if [ -z "$SHEET_ID" ]; then echo "Chưa có secret SHEET_ID – dùng dữ liệu mẫu."; fi
          node scripts/build.mjs
      - name: Yêu cầu Cloudflare dựng lại web
        env: { HOOK: "${{ secrets.CF_DEPLOY_HOOK }}" }
        run: |
          if [ -z "$HOOK" ]; then echo "Chưa có secret CF_DEPLOY_HOOK – bỏ qua."; exit 0; fi
          curl -fsS -X POST "$HOOK" >/dev/null && echo "Đã gửi yêu cầu dựng lại."
